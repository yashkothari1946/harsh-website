<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consultancy Booking</title>
  <style>
    .pay-btn {
      padding: 12px 24px;
      background-color: #6772e5;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .pay-btn:hover {
      background-color: #5469d4;
    }
  </style>
</head>
<body>
  <h1>Book Your Consultancy Session</h1>
  <p>Pay a fixed amount of $50 for a 30-minute session.</p>
  <button class="pay-btn" onclick="redirectToStripe()">Pay Now</button>

  <script>
    function redirectToStripe() {
      // Replace with your actual Stripe payment link
      window.location.href = "https://buy.stripe.com/test_123abcXYZ";
    }
  </script>
</body>
</html>
